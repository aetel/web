<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aetel</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #0b0b0c;
      --fg: #f5f5f5;
      --accent: #6366f1;
      --muted: #9a9aa2;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      text-align: center;
      padding: 2rem;
    }
    main {
      max-width: 32rem;
    }
    h1 {
      font-size: clamp(2rem, 6vw, 3.5rem);
      margin: 0 0 0.5rem;
      letter-spacing: -0.02em;
    }
    p {
      color: var(--muted);
      font-size: 1.1rem;
      line-height: 1.5;
      margin: 0;
    }
    .accent {
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <h1>Aetel<span class="accent">.</span></h1>
    <p>Coming soon.</p>
  </main>
</body>
</html>
